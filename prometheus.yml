# Prometheus configuration for scraping Spring Boot metrics
# Mount this file to your Prometheus container at /etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'loan-mapper-monitor'

scrape_configs:
  # Spring Boot Application
  - job_name: 'loan-model-mapper'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9092']  # For Docker on Mac/Windows
        # - targets: ['172.17.0.1:9092']        # For Docker on Linux
        labels:
          application: 'loan-model-mapper'
          environment: 'dev'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']